<!doctype html>
<html lang="en">
<head>

    #status { padding: 16px; }

    ol { padding-left: 20px; margin: 8px 0; }
    li { margin: 6px 0; }
    button { margin-top: 10px; padding: 6px 14px; border: 1px solid #444; border-radius: 6px; background: #1b1b1b; color: #ddd; cursor: pointer; }
    button:hover { background: #262626; }
    .detail { color: #888; font-size: 12px; margin-top: 12px; word-break: break-all; }
  </style>
</head>

  <div id="status">Connecting to dsh…</div>
